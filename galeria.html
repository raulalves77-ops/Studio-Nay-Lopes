
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fdf6f3" id="meta-theme-color">

    <title>Galeria - Studio Nay Lopes</title>

    <link rel="stylesheet" href="./style.css">

    <script>
        (function () {
            try {
                var theme = localStorage.getItem('sbd-theme');

                if (!theme && window.matchMedia &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    theme = 'dark';
                }

                if (theme === 'light' || theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', theme);
                }
            } catch (e) {}
        })();
    </script>

        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>
    <a href="#conteudo" class="skip-link">Pular para o conteúdo</a>
    <div class="main-wrapper">

        <header class="navbar">
            <div class="logo">
                <i class="fa-solid fa-spa logo-icon"></i>
                <div class="logo-text">
                    <span>Studio</span>
                    <strong>Nay Lopes</strong>
                </div>
            </div>

            <div class="nav-actions">
                <button type="button"
                        class="theme-toggle"
                        id="theme-toggle"
                        aria-label="Ativar modo escuro"
                        title="Modo escuro">
                    <i class="fa-solid fa-moon" aria-hidden="true"></i>
                </button>

                <button type="button"
                        class="nav-toggle"
                        aria-expanded="false"
                        aria-label="Abrir menu"
                        aria-controls="site-navigation">
                    <i class="fa-solid fa-bars" aria-hidden="true"></i>
                </button>
            </div>

            <nav class="nav-links"
                 id="site-navigation"
                 aria-label="Navegação principal">

                <a href="index.html">Home</a>
                <a href="servicos.html">Serviços</a>
                <a href="profissionais.html">Profissionais</a>
                <a href="galeria.html" class="active">Galeria</a>
                <a href="contato.html">Contato</a>
                <a href="agendar.html">Agendar</a>
                <a href="cadastro.html">Cadastre-se</a>

                <a href="login.html" class="btn-admin-nav">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Login
                </a>
            </nav>
        </header>

        <main id="conteudo" class="page-card">
            <h1>
                <i class="fa-solid fa-images"></i>
                Galeria
            </h1>

            <div class="gallery-grid">

                <button type="button"
                        class="gallery-item"
                        data-caption="Loiro perolado"
                        aria-label="Ampliar imagem: Loiro perolado">
                    <img src="imagens/loiro perolado.png"
                         alt="Loiro perolado"
                         loading="lazy">
                    <span class="gallery-zoom" aria-hidden="true">
                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                        Ampliar
                    </span>
                </button>

                <button type="button"
                        class="gallery-item"
                        data-caption="Moreno iluminado"
                        aria-label="Ampliar imagem: Moreno iluminado">
                    <img src="imagens/moreno iluminado.png"
                         alt="Moreno iluminado"
                         loading="lazy">
                    <span class="gallery-zoom" aria-hidden="true">
                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                        Ampliar
                    </span>
                </button>

                <button type="button"
                        class="gallery-item"
                        data-caption="Hidratação"
                        aria-label="Ampliar imagem: Hidratação">
                    <img src="imagens/hidratação.png"
                         alt="Hidratação"
                         loading="lazy">
                    <span class="gallery-zoom" aria-hidden="true">
                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                        Ampliar
                    </span>
                </button>

                <button type="button"
                        class="gallery-item"
                        data-caption="Extensão de cílios"
                        aria-label="Ampliar imagem: Extensão de cílios">
                    <img src="imagens/extensão de cílios.png"
                         alt="Extensão de cílios"
                         loading="lazy">
                    <span class="gallery-zoom" aria-hidden="true">
                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                        Ampliar
                    </span>
                </button>

                <button type="button"
                        class="gallery-item"
                        data-caption="Escova e hidratação"
                        aria-label="Ampliar imagem: Escova e hidratação">
                    <img src="imagens/escova e hidratação.png"
                         alt="Escova e hidratação"
                         loading="lazy">
                    <span class="gallery-zoom" aria-hidden="true">
                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                        Ampliar
                    </span>
                </button>

                <button type="button"
                        class="gallery-item"
                        data-caption="Agenda aberta"
                        aria-label="Ampliar imagem: Agenda aberta">
                    <img src="imagens/agenda aberta.png"
                         alt="Agenda aberta"
                         loading="lazy">
                    <span class="gallery-zoom" aria-hidden="true">
                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                        Ampliar
                    </span>
                </button>

                <button type="button"
                        class="gallery-item"
                        data-caption="Dicas de cuidados"
                        aria-label="Ampliar imagem: Dicas de cuidados">
                    <img src="imagens/4 dicas.png"
                         alt="Dicas de cuidados"
                         loading="lazy">
                    <span class="gallery-zoom" aria-hidden="true">
                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                        Ampliar
                    </span>
                </button>

                <button type="button"
                        class="gallery-item gallery-video"
                        data-video-src="imagens/promoção.mp4"
                        data-caption="Promoção do Studio Nay Lopes"
                        aria-label="Assistir vídeo promocional">

                    <video src="imagens/promoção.mp4"
                           muted
                           preload="metadata"
                           playsinline
                           aria-label="Prévia do vídeo promocional">
                    </video>

                    <span class="gallery-zoom" aria-hidden="true">
                        <i class="fa-solid fa-circle-play"></i>
                        Assistir vídeo
                    </span>
                </button>

            </div>
        </main>

        <footer>
            © 2026 Studio Nay Lopes
        </footer>

    </div>

    <!-- Janela para ampliar imagens e reproduzir vídeos -->
    <div class="media-lightbox"
         id="media-lightbox"
         role="dialog"
         aria-modal="true"
         aria-hidden="true"
         aria-label="Visualização da galeria">

        <button type="button"
                class="media-lightbox-close"
                aria-label="Fechar visualização">
            &times;
        </button>

        <div class="media-lightbox-content"
             id="media-lightbox-content">
        </div>

        <p class="media-lightbox-caption"
           id="media-lightbox-caption">
        </p>
    </div>

    <script src="./script.js"></script>

</body>
</html>
