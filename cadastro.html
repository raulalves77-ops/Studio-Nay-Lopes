<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fdf6f3" id="meta-theme-color">
    <title>Cadastro - Studio Nay Lopes</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('sbd-theme');
                if (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
                if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <a href="#conteudo" class="skip-link">Pular para o conteúdo</a>
    <div class="main-wrapper">
        <header class="navbar">
            <div class="logo"><i class="fa-solid fa-spa logo-icon"></i><div class="logo-text"><span>Studio</span><strong>Nay Lopes</strong></div></div>
            <div class="nav-actions">
                <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Ativar modo escuro" title="Modo escuro"><i class="fa-solid fa-moon" aria-hidden="true"></i></button>
                <button type="button" class="nav-toggle" aria-expanded="false" aria-label="Abrir menu" aria-controls="site-navigation"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
            </div>
            <nav class="nav-links" id="site-navigation" aria-label="Navegação principal">
                <a href="index.html">Home</a>
                <a href="servicos.html">Serviços</a>
                <a href="profissionais.html">Profissionais</a>
                <a href="galeria.html">Galeria</a>
                <a href="contato.html">Contato</a>
                <a href="agendar.html">Agendar</a>
                <a href="cadastro.html" class="active">Cadastre-se</a>
                <a href="login.html" class="btn-admin-nav"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
            </nav>
        </header>

        <main id="conteudo" class="registration-container">
            <!-- Form exclusivo para Cliente -->
            <form id="form-cliente" class="form-card" onsubmit="handleRegister(event, 'cliente')">
                <h2>Criar Conta</h2>
                <p class="form-hint">Cadastre-se para agendar os seus horários com facilidade.</p>
                
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="cli-nome" required>
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="cli-email" required>
                </div>
                <div class="form-group">
                    <label>Telefone / WhatsApp</label>
                    <input type="tel" id="cli-telef" placeholder="(11) 99999-9999" required>
                </div>
                
                <!-- Campos de Segurança -->
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="cli-senha" placeholder="Crie uma senha segura" required>
                    <!-- Container da barra de força -->
                    <div class="password-strength-container">
                        <div class="password-strength-bar" id="strength-bar"></div>
                    </div>
                    <span class="password-strength-text" id="strength-text"></span>
                </div>
                
                <div class="form-group">
                    <label>Confirmar Senha</label>
                    <input type="password" id="cli-confirma-senha" placeholder="Repita a sua senha" required>
                    <!-- Texto indicando se as senhas são iguais -->
                    <span class="password-match-text" id="match-text"></span>
                </div>
                
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">CADASTRAR</button>
                
                <div style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-secondary);">
                    Já possui cadastro? <a href="login.html" style="color: var(--accent-marsala); font-weight: 600; text-decoration: none;">Faça Login aqui</a>
                </div>
            </form>
        </main>
        <footer>© 2026 Studio Nay Lopes</footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
